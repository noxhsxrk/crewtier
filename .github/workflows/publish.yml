# Publishes to npm when you push a tag like v0.4.0.
# Uses npm trusted publishing (OIDC): no token. One-time setup, already done:
#   npm trust github @noxhsxrk/crewtier --file publish.yml --repo noxhsxrk/crewtier --allow-publish
name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      # trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@11.21.3
      - name: Check tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Syntax check
        run: bash -n bin/crewtier scripts/*.sh install.sh
      - run: npm publish --provenance --access public
